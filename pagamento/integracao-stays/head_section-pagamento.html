<script>/* pagamento: na página de confirmação da reserva (/customer/<idioma>/reservation/<código>/confirmation), leva o hóspede para pagamento.f4let.com/r/<código>. O checkout da Stays troca de tela sem recarregar, então vigia o endereço. Desfazer = apagar esta linha. */(function(){var PAY="https://pagamento.f4let.com",done=0;function check(){if(done)return;var m=location.pathname.match(/^\/customer\/(pt|en|es)\/reservation\/([A-Za-z0-9]{4,16})\/confirmation\/?$/);if(!m||!document.body)return;done=1;clearInterval(iv);var lang=m[1],code=m[2].toUpperCase(),url=PAY+"/r/"+code+"?lang="+lang;var tx={pt:["Falta só o pagamento","Estamos levando você para a página de pagamento seguro (cartão ou Pix).","Pagar agora"],en:["Only the payment is left","Taking you to the secure payment page (card or Pix).","Pay now"],es:["Solo falta el pago","Te llevamos a la página de pago seguro (tarjeta o Pix).","Pagar ahora"]}[lang];function show(){if(document.getElementById("pay4l"))return;var d=document.createElement("div");d.id="pay4l";d.setAttribute("role","status");d.style.cssText="position:fixed;inset:0;z-index:2147483000;background:rgba(252,250,246,.97);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Jost,system-ui,sans-serif;color:#2b231d;text-align:center";d.innerHTML='<div style="max-width:440px"><p style="font-size:30px;font-weight:300;margin:0 0 10px;line-height:1.15">'+tx[0]+'</p><p style="color:#7a6d61;margin:0 0 24px;font-size:16px">'+tx[1]+'</p><a href="'+url+'" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:#2b231d;color:#fff;text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase">'+tx[2]+'</a></div>';document.body.appendChild(d);setTimeout(function(){location.href=url},2500)}show()}var iv=setInterval(check,400);window.addEventListener("popstate",check);if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",check);else check()})();</script>
