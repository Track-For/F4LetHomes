<script>/* checkout: ao digitar o CEP (8 dígitos), busca no ViaCEP e preenche país, estado/UF, cidade, endereço e bairro; foco vai para o Número. A Stays recarrega a lista de estados depois de trocar o país, por isso o estado é reaplicado por 4 s */(function(){var last="";function J(){return window.jQuery}function setV(id,v){var el=document.getElementById(id);if(!el||!v)return;el.value=v;el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}function setSel(id,v,cb){var $=J(),el=document.getElementById(id),n=0;if(!$||!el)return cb&&cb();(function t(){if([].some.call(el.options,function(o){return o.value===v})){if(el.value!==v){$(el).val(v).trigger("change");if($.fn.selectpicker)$(el).selectpicker("refresh")}cb&&cb()}else if(n++<30)setTimeout(t,200);else cb&&cb()})()}function go(cep){var c=document.getElementById("country");if(c&&c.value&&c.value!=="BR")return;fetch("https://viacep.com.br/ws/"+cep+"/json/").then(function(r){return r.json()}).then(function(d){if(!d||d.erro)return;setV("street",d.logradouro);setV("region",d.bairro);setV("city",d.localidade);setSel("country","BR",function(){var k=0;(function keep(){setSel("state",d.uf);if(k++<16)setTimeout(keep,250)})();var n=document.getElementById("street_num");if(n&&!n.value&&d.logradouro)n.focus()})}).catch(function(){})}document.addEventListener("input",function(e){if(!e.target||e.target.id!=="zip")return;var cep=(e.target.value||"").replace(/\D/g,"");if(cep.length===8&&cep!==last){last=cep;go(cep)}},true)})();</script>
