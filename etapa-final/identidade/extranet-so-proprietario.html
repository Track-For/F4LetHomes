<style>/* menu: "Extranet do proprietário" (link para /landlord-apartments/) e a aba "Minhas propriedades" do perfil só aparecem para proprietário com imóvel confirmado. O script abaixo marca html.own4l. Desfazer = apagar esta linha e a próxima. */html:not(.own4l) li:has(>a[href*="/landlord-apartments/"]){display:none!important}</style>
<script>/* proprietário = está logado e a página "Confirmado" (/customer/<idioma>/profile/landlord-apartments/confirmed) lista algum imóvel. Resultado guardado na sessão do navegador. Não proprietário que abrir essas páginas vai para o perfil. */(function(){var d=document.documentElement,K="own4l";function lang(){var m=location.pathname.match(/^\/(?:customer\/)?(pt|en|es)\//);return m?m[1]:"pt"}function onPage(){return /\/profile\/landlord-apartments\//.test(location.pathname)}function apply(own){d.classList.toggle("own4l",own);if(!own&&onPage())location.replace("/customer/"+lang()+"/profile")}function has(doc){var c=doc.querySelector("#maincontent .col-sm-9");if(doc.querySelector("#maincontent .apartment-images"))return true;return !!c&&[].some.call(c.children,function(x){return x.tagName!=="SCRIPT"&&!x.classList.contains("confirmed-info")})}function run(){var out=document.querySelector('a[href*="/logout"]');if(!out){try{sessionStorage.removeItem(K)}catch(e){}apply(false);return}var id=(window._user&&window._user._id)||"",v=null;try{v=sessionStorage.getItem(K)}catch(e){}if(v===id+":1"){apply(true);return}if(v===id+":0"){apply(false);return}if(/\/profile\/landlord-apartments\/confirmed/.test(location.pathname)){var own=has(document);try{sessionStorage.setItem(K,id+(own?":1":":0"))}catch(e){}apply(own);return}fetch("/customer/"+lang()+"/profile/landlord-apartments/confirmed",{credentials:"same-origin"}).then(function(r){return r.ok&&!/\/login/.test(r.url)?r.text():""}).then(function(t){var own=!!t&&has(new DOMParser().parseFromString(t,"text/html"));try{sessionStorage.setItem(K,id+(own?":1":":0"))}catch(e){}apply(own)}).catch(function(){d.classList.remove("own4l")})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run()})();</script>
