<script>
/* home: animação de entrada e parallax */
document.addEventListener("DOMContentLoaded",function(){var r=document.getElementById("h4l");if(!r||!document.body.classList.contains("__page_index"))return;if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;var d=document.documentElement;d.classList.add("h4l-fx");
function q(s){return Array.prototype.slice.call(r.querySelectorAll(s))}

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{rootMargin:"0px 0px -8% 0px",threshold:.12});

var hero=r.querySelector(".hero"),slides=q(".hero .slide"),hd=r.querySelector(".hero .hd"),par=q(".edit .ph,.feature .ph,.tile .ph"),tick=false;
function upd(){tick=false;var y=window.scrollY,vh=window.innerHeight;if(hero){var h=hero.offsetHeight;if(y<h+50){slides.forEach(function(s){s.style.translate="0 "+(y*.35).toFixed(1)+"px"});if(hd){hd.style.translate="0 "+(y*.18).toFixed(1)+"px";hd.style.opacity=Math.max(0,1-y/(h*.7)).toFixed(3)}}}
