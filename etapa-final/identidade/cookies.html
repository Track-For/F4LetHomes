<style>
/* banner de cookies (LGPD) */
#ck4l{position:fixed;left:24px;bottom:24px;z-index:10050;box-sizing:border-box;width:420px;max-width:calc(100vw - 32px);padding:22px 22px 18px;background:#fcfaf6;color:#2b231d;border:1px solid #e4dccf;border-radius:14px;box-shadow:0 18px 50px rgba(43,35,29,.18);font:400 14px/1.55 "Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;transform:translateY(16px);visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
#ck4l.ck4l-on{opacity:1;transform:none;visibility:visible;transition:opacity .45s ease,transform .45s ease}
#ck4l .ck4l-t{margin:0 0 6px;font-size:16px;font-weight:500;letter-spacing:.01em;color:#2b231d}
#ck4l .ck4l-p{margin:0 0 16px;color:#7a6d61;font-size:14px}
#ck4l .ck4l-p a{color:#2b231d;text-decoration:underline;text-underline-offset:2px}
#ck4l .ck4l-b{display:flex;gap:10px;flex-wrap:wrap}
#ck4l button{flex:1 1 140px;margin:0;padding:11px 16px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:500;line-height:1;letter-spacing:.02em;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
#ck4l .ck4l-ok{background:#2b231d;color:#fcfaf6;border:1px solid #2b231d}
#ck4l .ck4l-ok:hover{background:#46392f;border-color:#46392f}
#ck4l .ck4l-no{background:transparent;color:#2b231d;border:1px solid #e4dccf}
#ck4l .ck4l-no:hover{border-color:#2b231d}
#ck4l button:focus-visible{outline:2px solid #2b231d;outline-offset:2px}
@media (max-width:600px){#ck4l{left:16px;right:16px;bottom:16px;width:auto;max-width:none;padding:18px 18px 16px}}
@media (prefers-reduced-motion:reduce){#ck4l,#ck4l.ck4l-on{transition:none;transform:none}}
</style>
<script>
/* banner de cookies (LGPD): grava ck4l=all|essential por 1 ano; "aceitar" também grava acceptCookies (padrão Stays) */
(function(){function g(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?m[1]:""}
function s(n,v){var d=new Date();d.setTime(d.getTime()+365*864e5);document.cookie=n+"="+v+";expires="+d.toUTCString()+";path=/;SameSite=Lax"}
window.dataLayer=window.dataLayer||[];var c=g("ck4l");if(c){window.dataLayer.push({event:"cookie_consent",consent:c});return}
var L={pt:{t:"Sua privacidade",p:"Usamos cookies para o site funcionar e para entender como ele é usado. Você escolhe se aceita os cookies de análise.",l:"Política de privacidade",ok:"Aceitar todos",no:"Só os essenciais"},
en:{t:"Your privacy",p:"We use cookies to make the site work and to understand how it is used. You choose whether to allow analytics cookies.",l:"Privacy policy",ok:"Accept all",no:"Essential only"},
es:{t:"Tu privacidad",p:"Usamos cookies para que el sitio funcione y para entender cómo se usa. Tú eliges si aceptas las cookies de análisis.",l:"Política de privacidad",ok:"Aceptar todas",no:"Solo las esenciales"}};
function init(){if(document.getElementById("ck4l"))return;var lg=(document.documentElement.lang||"pt").slice(0,2).toLowerCase();if(!L[lg])lg="pt";var t=L[lg];
var b=document.createElement("div");b.id="ck4l";b.setAttribute("role","dialog");b.setAttribute("aria-live","polite");b.setAttribute("aria-label",t.t);
b.innerHTML='<p class="ck4l-t">'+t.t+'</p><p class="ck4l-p">'+t.p+' <a href="/'+lg+'/politica-de-privacidade">'+t.l+'</a>.</p><div class="ck4l-b"><button type="button" class="ck4l-no">'+t.no+'</button><button type="button" class="ck4l-ok">'+t.ok+'</button></div>';
document.body.appendChild(b);function close(v){s("ck4l",v);if(v==="all"){s("acceptCookies","true");window.dispatchEvent(new Event("cookieAlertAccept"))}window.dataLayer.push({event:"cookie_consent",consent:v});b.classList.remove("ck4l-on");setTimeout(function(){b.remove()},500)}
b.querySelector(".ck4l-ok").addEventListener("click",function(){close("all")});b.querySelector(".ck4l-no").addEventListener("click",function(){close("essential")});
setTimeout(function(){b.classList.add("ck4l-on")},900)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init()})();
</script>
