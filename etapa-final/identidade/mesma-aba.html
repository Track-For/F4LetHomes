<script>/* acomodações abrem na mesma aba (Ctrl/Cmd+clique ainda abre nova aba) */document.addEventListener("click",function(e){if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;var a=e.target.closest&&e.target.closest("a[target=\"_blank\"]");if(!a||a.origin!==location.origin)return;if(!/\/(apartment|building)\//.test(a.pathname))return;e.preventDefault();location.href=a.href},true);</script>
