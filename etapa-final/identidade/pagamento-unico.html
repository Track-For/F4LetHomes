<script>/* checkout: quando só existe uma forma de pagamento, já deixa marcada (clica no bloco .payment-option, como o hóspede faria). Desfazer = apagar esta linha. */(function(){setInterval(function(){var o=document.querySelectorAll("#payment-methods .payment-option");if(o.length!==1)return;var p=o[0];if(p.classList.contains("selected")||p.getAttribute("data-auto4l"))return;var r=p.querySelector("[name='payment_option']");if(r&&r.checked)return;p.setAttribute("data-auto4l","1");p.click()},500)})();</script>
